version: "3.9"
services:
  db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_DB: shobarshonge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: dev-secret-key
      DJANGO_ALLOWED_HOSTS: "*"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: shobarshonge
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      CHANNEL_LAYER_BACKEND: redis
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      - db
      - redis
      - ai-service
    ports:
      - "8000:8000"

  celery-worker:
    build: ./backend
    command: celery -A config worker -l info
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: dev-secret-key
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: shobarshonge
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      CHANNEL_LAYER_BACKEND: redis
    depends_on:
      - db
      - redis

  celery-beat:
    build: ./backend
    command: celery -A config beat -l info
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: dev-secret-key
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: shobarshonge
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      CHANNEL_LAYER_BACKEND: redis
    depends_on:
      - db
      - redis

  ai-service:
    build: ./ai_service
    environment:
      AI_MODE: cpu
      VECTOR_STORE_PATH: vector_store/faqs.json
    ports:
      - "8001:8000"

  frontend:
    image: node:20
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_AI_SERVICE_URL: http://localhost:8001
      VITE_APP_NAME: Shobar Shonge
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:
