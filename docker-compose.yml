version: "3.9"
services:
  db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_DB: shobarshonge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: dev-secret-key
      DJANGO_ALLOWED_HOSTS: "*"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: shobarshonge
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      - db
      - redis
      - ai-service
    ports:
      - "8000:8000"

  celery-worker:
    build: ./backend
    command: celery -A config worker -l info
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: dev-secret-key
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: shobarshonge
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - db
      - redis

  celery-beat:
    build: ./backend
    command: celery -A config beat -l info
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: dev-secret-key
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: shobarshonge
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - db
      - redis

  ai-service:
    build: ./ai_service
    environment:
      AI_MODE: cpu
      VECTOR_STORE_PATH: vector_store/faqs.json
    ports:
      - "8001:8000"

volumes:
  pgdata:
